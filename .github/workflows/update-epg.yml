name: Update EPG

on:
  schedule:
    # UTC. With DAYS=1 only "today" is fetched, so the 00:20 run is needed to get the new day
    # right after midnight. GitHub may start scheduled runs a few minutes late.
    - cron: "20 0,3,15 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["channels.xml", "aliases.json", "scripts/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: epg
  cancel-in-progress: false

env:
  DAYS: 1               # days of guide to fetch (1 = today only; 2 = today + tomorrow)
  MIN_CHANNELS: 150     # don't publish if fewer channels than this have data

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Get the latest iptv-org/epg grabber (site fixes arrive automatically)
        run: git clone --depth 1 -b master https://github.com/iptv-org/epg.git grabber

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install grabber
        working-directory: grabber
        run: npm install --no-audit --no-fund

      - name: Grab guides from MEO, NOS, Vodafone, RTP, SPORT TV, TVI, SIC
        working-directory: grabber
        run: |
          npm run grab --- \
            --channels=../channels.xml \
            --output=../guides/{site}.xml \
            --days=$DAYS \
            --maxConnections=10 \
            --timeout=30000 \
            --delay=100

      - name: Merge into one guide (best source per channel + your old IDs)
        run: |
          python3 scripts/merge.py \
            --input guides \
            --aliases aliases.json \
            --channels channels.xml \
            --output public/epg.xml \
            --min-channels $MIN_CHANNELS
          echo "<html><body><h3>My PT EPG</h3><p><a href='epg.xml.gz'>epg.xml.gz</a> | <a href='epg.xml'>epg.xml</a> | <a href='report.txt'>report.txt</a></p></body></html>" > public/index.html
          head -n 3 public/report.txt
          grep -c "NO DATA" public/report.txt || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
