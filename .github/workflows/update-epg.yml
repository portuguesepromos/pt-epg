name: Update EPG

on:
  schedule:
    # UTC, every 2 hours (00:20, 02:20, 04:20 ...) so the guide always starts ~2 hours before now.
    # GitHub may start scheduled runs a few minutes late.
    - cron: "20 */2 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["channels.xml", "aliases.json", "scripts/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: epg
  cancel-in-progress: false

env:
  DAYS: 2               # days of guide to fetch (1 = today only; 2 = today + tomorrow)
  PAST_HOURS: 2         # keep programmes that ended up to this many hours ago (older ones are dropped)
  LOGO_FIX: invert      # dark logos -> light copies for dark apps: invert | plate | off
  MIN_CHANNELS: 150     # safety check: needs min(150, 60% of the channels in channels.xml) with data, else nothing is published

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Get the latest iptv-org/epg grabber (site fixes arrive automatically)
        run: git clone --depth 1 -b master https://github.com/iptv-org/epg.git grabber

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install grabber
        working-directory: grabber
        run: npm install --no-audit --no-fund

      - name: Grab guides from MEO, NOS, Vodafone, RTP, SPORT TV, TVI, SIC
        working-directory: grabber
        run: |
          npm run grab --- \
            --channels=../channels.xml \
            --output=../guides/{site}.xml \
            --days=$DAYS \
            --maxConnections=10 \
            --timeout=30000 \
            --delay=100

      - name: Merge into one guide (best source per channel + your old IDs)
        run: |
          python3 scripts/merge.py \
            --input guides \
            --aliases aliases.json \
            --channels channels.xml \
            --output public/epg.xml \
            --min-channels $MIN_CHANNELS \
            --past-hours $PAST_HOURS
          if [ "$LOGO_FIX" != "off" ]; then
            # Pillow + numpy for the logo fixer; any problem here keeps the original logos
            python3 -c "import PIL, numpy" 2>/dev/null \
              || sudo apt-get install -y -qq python3-pil python3-numpy >/dev/null 2>&1 \
              || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil python3-numpy >/dev/null 2>&1; } || true
            PAGES_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
            python3 scripts/fix_logos.py --xml public/epg.xml --base-url "$PAGES_URL" --mode "$LOGO_FIX" \
              || echo "logo fixing failed - original logos kept"
          fi
          echo "<html><body><h3>My PT EPG</h3><p><a href='epg.xml.gz'>epg.xml.gz</a> | <a href='epg.xml'>epg.xml</a> | <a href='report.txt'>report.txt</a></p></body></html>" > public/index.html
          head -n 3 public/report.txt
          grep -c "NO DATA" public/report.txt || true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
